<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HALO QUIZ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #00d4aa;
    --teal-dim: #007a62;
    --bg: #050d0b;
    --panel: #0a1a16;
    --panel2: #0d2118;
    --border: #1a4035;
    --text: #c8f0e8;
    --text-dim: #567a72;
    --gold: #ffd700;
    --red: #ff3a3a;
    --white: #e8fff9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,212,170,0.015) 2px,
      rgba(0,212,170,0.015) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* Grid background */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,170,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,170,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 20px;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  header {
    text-align: center;
    padding: 48px 0 36px;
    position: relative;
  }

  .halo-ring {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 6px solid var(--teal);
    box-shadow: 0 0 30px var(--teal), inset 0 0 20px rgba(0,212,170,0.15);
    margin: 0 auto 24px;
    animation: spin 18s linear infinite;
    position: relative;
  }
  .halo-ring::before {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 2px solid rgba(0,212,170,0.3);
  }
  .halo-ring::after {
    content: '';
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    border: 1px solid rgba(0,212,170,0.12);
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 900;
    color: var(--white);
    letter-spacing: 0.18em;
    text-shadow: 0 0 40px var(--teal), 0 0 80px rgba(0,212,170,0.3);
    line-height: 1;
  }

  .subtitle {
    margin-top: 10px;
    font-size: 0.75rem;
    color: var(--teal-dim);
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  .progress-bar-wrap {
    margin: 32px 0 8px;
    background: var(--panel2);
    border: 1px solid var(--border);
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teal-dim), var(--teal));
    width: 0%;
    transition: width 0.5s ease;
    box-shadow: 0 0 10px var(--teal);
  }
  .progress-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-align: right;
    margin-bottom: 28px;
  }

  /* QUESTION CARD */
  .question-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
    margin-bottom: 20px;
    overflow: hidden;
    transition: border-color 0.3s;
    position: relative;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--teal), transparent);
    opacity: 0.5;
  }

  .question-header {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .q-number {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    color: var(--teal);
    background: rgba(0,212,170,0.08);
    border: 1px solid var(--teal-dim);
    padding: 3px 8px;
    border-radius: 2px;
    letter-spacing: 0.1em;
    white-space: nowrap;
    margin-top: 2px;
    flex-shrink: 0;
  }

  .q-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0.05em;
    line-height: 1.5;
  }

  .options {
    padding: 12px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-label {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    padding: 10px 14px;
    border: 1px solid transparent;
    border-radius: 2px;
    transition: all 0.15s;
    background: rgba(0,0,0,0.2);
  }
  .option-label:hover {
    border-color: var(--teal-dim);
    background: rgba(0,212,170,0.05);
  }

  .option-label input[type="radio"] {
    display: none;
  }

  .custom-radio {
    width: 16px;
    height: 16px;
    border: 2px solid var(--text-dim);
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
    transition: all 0.15s;
  }
  .option-label:hover .custom-radio {
    border-color: var(--teal);
  }
  .option-label input:checked ~ .custom-radio {
    border-color: var(--teal);
    background: var(--teal);
    box-shadow: 0 0 8px var(--teal);
  }
  .option-label input:checked ~ .custom-radio::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--bg);
  }

  .option-text {
    font-size: 0.8rem;
    color: var(--text);
    letter-spacing: 0.05em;
  }
  .option-label input:checked ~ .custom-radio ~ .option-text {
    color: var(--teal);
  }

  /* Result states */
  .option-label.correct {
    border-color: var(--teal) !important;
    background: rgba(0,212,170,0.08) !important;
  }
  .option-label.correct .option-text { color: var(--teal) !important; }
  .option-label.wrong {
    border-color: var(--red) !important;
    background: rgba(255,58,58,0.06) !important;
  }
  .option-label.wrong .option-text { color: var(--red) !important; }

  /* SUBMIT */
  .submit-wrap {
    text-align: center;
    margin: 36px 0;
  }

  #submit-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--teal);
    border: none;
    padding: 16px 48px;
    cursor: pointer;
    border-radius: 2px;
    box-shadow: 0 0 30px rgba(0,212,170,0.4);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  #submit-btn:hover {
    background: #00ffcc;
    box-shadow: 0 0 50px rgba(0,212,170,0.7);
    transform: translateY(-2px);
  }
  #submit-btn:active { transform: translateY(0); }
  #submit-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  /* RESULT PANEL */
  #result-panel {
    display: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 40px 32px;
    text-align: center;
    margin-bottom: 40px;
    position: relative;
    overflow: hidden;
  }
  #result-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,212,170,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .badge-display {
    font-size: 5rem;
    margin-bottom: 16px;
    animation: badgePop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    display: block;
  }
  @keyframes badgePop {
    from { transform: scale(0) rotate(-15deg); opacity: 0; }
    to { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .badge-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem;
    font-weight: 900;
    letter-spacing: 0.2em;
    margin-bottom: 6px;
  }

  .score-display {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: var(--teal);
    text-shadow: 0 0 30px var(--teal);
    margin: 16px 0 8px;
  }

  .score-sub {
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    margin-bottom: 24px;
  }

  .result-message {
    font-size: 0.85rem;
    color: var(--text);
    line-height: 1.7;
    max-width: 480px;
    margin: 0 auto 28px;
  }

  #retry-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--teal);
    background: transparent;
    border: 1px solid var(--teal-dim);
    padding: 12px 32px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }
  #retry-btn:hover {
    border-color: var(--teal);
    background: rgba(0,212,170,0.08);
    box-shadow: 0 0 20px rgba(0,212,170,0.2);
  }

  .tier-table {
    margin: 28px auto 0;
    max-width: 380px;
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    font-size: 0.72rem;
  }
  .tier-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    transition: background 0.2s;
  }
  .tier-row:last-child { border-bottom: none; }
  .tier-row.active {
    background: rgba(0,212,170,0.07);
    color: var(--teal);
  }
  .tier-icon { font-size: 1.1rem; width: 24px; text-align: center; }
  .tier-label { flex: 1; letter-spacing: 0.1em; }
  .tier-range { font-family: 'Orbitron', sans-serif; font-size: 0.65rem; }

  footer {
    text-align: center;
    padding: 24px 0 40px;
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 0.2em;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="halo-ring"></div>
    <h1>HALO QUIZ</h1>
    <p class="subtitle">Teste dein Wissen über das Halo-Universum</p>
  </header>

  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill"></div></div>
  <div class="progress-label" id="progress-label">0 / 18 beantwortet</div>

  <div id="quiz-form"></div>

  <div class="submit-wrap">
    <button id="submit-btn" disabled>AUSWERTUNG STARTEN</button>
  </div>

  <div id="result-panel">
    <span class="badge-display" id="badge-icon"></span>
    <div class="badge-name" id="badge-name"></div>
    <div class="score-display" id="score-display"></div>
    <div class="score-sub" id="score-sub"></div>
    <div class="result-message" id="result-message"></div>
    <button id="retry-btn">NEU STARTEN</button>
    <div class="tier-table" id="tier-table"></div>
  </div>

  <footer>HALO &copy; BUNGIE / 343 INDUSTRIES &nbsp;|&nbsp; QUIZ GENERIERT FÜR FANS</footer>
</div>

<script>
const questions = [
  {
    q: "Wie heißt das Hauptschiff der Marines?",
    options: ["Infinity", "Pillar of Autumn", "Composer"],
    answer: 0
  },
  {
    q: "Wie heißt der blau-schwarze Spartaner?",
    options: ["Spartan Locke", "Master Chief", "Cortana"],
    answer: 0
  },
  {
    q: "Wer ist der Wächter von Cortana?",
    options: ["Der Master Chief", "Der Ewige Wächter", "Der Gebieter"],
    answer: 0
  },
  {
    q: "Welche Elite-Einheit ist nicht biologisch verändert?",
    options: ["Spartans", "Marines", "ODST"],
    answer: 2
  },
  {
    q: "Wie heißt die Halo-Fabrik?",
    options: ["Arche", "High Charity", "Infinity"],
    answer: 0
  },
  {
    q: "Wie viele Halos gibt es in Halo 2?",
    options: ["7", "6", "2"],
    answer: 1
  },
  {
    q: "Was ist der Didaktiker?",
    options: ["Ein Blutvater", "Ein Mensch", "Teil der Flut"],
    answer: 0
  },
  {
    q: "Wie heißt der Master Chief mit bürgerlichem Namen?",
    options: ["John", "Keyes", "Miriam"],
    answer: 0
  },
  {
    q: "Wie heißt die KI vom Chief?",
    options: ["Gebieter", "Osiris", "Cortana"],
    answer: 2
  },
  {
    q: "Wie heißt der Führer der Verbannten?",
    options: ["Tartarus", "Thel 'Vadam", "Atriox"],
    answer: 2
  },
  {
    q: "Wie heißen die 3 Propheten in Halo 2?",
    options: [
      "Prophet des Bedauerns, Prophet der Wahrheit, Prophet der Gnade",
      "Prophet des Krieges, Prophet des Feuers, Prophet des Verlusts"
    ],
    answer: 0
  },
  {
    q: "Wie heißt der Anführer der Brutes?",
    options: ["Tartarus", "Der Verbannte", "Lurus"],
    answer: 0
  },
  {
    q: "Wie heißt das Gehirn der Flut?",
    options: ["Die Pest", "Flut", "Gravemind"],
    answer: 2
  },
  {
    q: "Was sind die Halos?",
    options: ["Superwaffen", "Planeten", "Allianz-Basen"],
    answer: 0
  },
  {
    q: "Wie nennen die Eliten den 343 Guilty Spark?",
    options: ["Orakel", "Verräter", "KI"],
    answer: 0
  },
  {
    q: "Wie heißt der Commander der Menschen (Halo 1)?",
    options: ["Kapitän Keyes", "Johnson", "Dr. Halsey"],
    answer: 0
  },
  {
    q: "Wie heißt das Hauptschiff der Menschen in Halo 1?",
    options: ["Die Pillar of Autumn", "Zerstörer", "UNSC Infinity"],
    answer: 0
  },
  {
    q: "Wie heißt der Gebieter mit vollem Namen?",
    options: ["Thel 'Vadammee", "Bob", "Ketzer"],
    answer: 0
  }
];

const tiers = [
  { min: 100, icon: "🏆", name: "LEGENDARY", color: "#ffd700", msg: "Perfekt! Du kennst das Halo-Universum in- und auswendig. Reclaimer!" },
  { min: 89,  icon: "⚔️", name: "MASTER CHIEF", color: "#00d4aa", msg: "Hervorragend, Spartan. Du bist bereit für den Kampf gegen die Allianz." },
  { min: 70,  icon: "🎖️", name: "SPARTAN", color: "#7ec8e3", msg: "Gut gemacht! Du hast das Zeug zum Spartaner." },
  { min: 50,  icon: "🪖", name: "ODST", color: "#8fbc8f", msg: "Solide. Du bist ein erfahrener ODST – weiter üben!" },
  { min: 30,  icon: "🔫", name: "MARINE", color: "#a0a0a0", msg: "Nicht schlecht für einen normalen Marine. Mehr Halo spielen!" },
  { min: 0,   icon: "💀", name: "FLOOD-OPFER", color: "#ff3a3a", msg: "Die Flut hat dein Gehirn befallen. Sofort Halo spielen!" }
];

function getTier(pct) {
  return tiers.find(t => pct >= t.min);
}

const form = document.getElementById('quiz-form');
let answered = new Set();

questions.forEach((q, qi) => {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.id = `card-${qi}`;

  const header = document.createElement('div');
  header.className = 'question-header';
  header.innerHTML = `<span class="q-number">F${String(qi+1).padStart(2,'0')}</span><span class="q-text">${q.q}</span>`;

  const opts = document.createElement('div');
  opts.className = 'options';

  q.options.forEach((opt, oi) => {
    const lbl = document.createElement('label');
    lbl.className = 'option-label';
    lbl.innerHTML = `
      <input type="radio" name="q${qi}" value="${oi}">
      <span class="custom-radio"></span>
      <span class="option-text">${opt}</span>
    `;
    lbl.querySelector('input').addEventListener('change', () => {
      answered.add(qi);
      updateProgress();
    });
    opts.appendChild(lbl);
  });

  card.appendChild(header);
  card.appendChild(opts);
  form.appendChild(card);
});

function updateProgress() {
  const total = questions.length;
  const done = answered.size;
  const pct = (done / total) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${done} / ${total} beantwortet`;
  document.getElementById('submit-btn').disabled = done < total;
}

document.getElementById('submit-btn').addEventListener('click', () => {
  let correct = 0;

  questions.forEach((q, qi) => {
    const selected = document.querySelector(`input[name="q${qi}"]:checked`);
    const val = selected ? parseInt(selected.value) : -1;
    const card = document.getElementById(`card-${qi}`);
    const labels = card.querySelectorAll('.option-label');

    labels.forEach((lbl, oi) => {
      lbl.style.pointerEvents = 'none';
      if (oi === q.answer) lbl.classList.add('correct');
      else if (oi === val && val !== q.answer) lbl.classList.add('wrong');
    });

    if (val === q.answer) correct++;
  });

  const pct = Math.round((correct / questions.length) * 100);
  const tier = getTier(pct);

  document.getElementById('badge-icon').textContent = tier.icon;
  document.getElementById('badge-name').style.color = tier.color;
  document.getElementById('badge-name').textContent = tier.name;
  document.getElementById('score-display').textContent = `${correct} / ${questions.length}`;
  document.getElementById('score-sub').textContent = `${pct}% KORREKT`;
  document.getElementById('result-message').textContent = tier.msg;

  // Tier table
  const table = document.getElementById('tier-table');
  table.innerHTML = tiers.map(t => `
    <div class="tier-row ${t.name === tier.name ? 'active' : ''}">
      <span class="tier-icon">${t.icon}</span>
      <span class="tier-label" style="color:${t.name === tier.name ? t.color : ''}">${t.name}</span>
      <span class="tier-range">${t.min === 0 ? '0–29%' : t.min === 30 ? '30–49%' : t.min === 50 ? '50–69%' : t.min === 70 ? '70–88%' : t.min === 89 ? '89–99%' : '100%'}</span>
    </div>
  `).join('');

  document.getElementById('submit-btn').style.display = 'none';
  const panel = document.getElementById('result-panel');
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

document.getElementById('retry-btn').addEventListener('click', () => {
  location.reload();
});
</script>
</body>
</html>
